name: release

# 构建（无密钥）在 apk.yml；这里只做「签名 -> 指纹校验 -> SLSA 证明 -> 发布」。
# 信任边界：
#   * 所有 action 钉**完整 commit SHA**，不用浮动版本标签（防第三方 action 投毒）。
#   * 密钥只挂在 environment: sign-gate 上 ⇒ 只有声明该环境的 job 能读到，apk.yml 那条构建流拿不到。
#   * 签名后强制比对证书指纹，与手机已信任的证书不符就**拒绝发布**（防误配/防悄悄换 key）。
#   * 触发方式是人手动 dispatch（由维护者口头确认后执行），不接 pull_request_target / workflow_run。
#   * 发布后哈希另记到 CI 写不到的仓库（home-mesh 文档），构成独立核对渠道。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "apk 工作流的运行 ID（产出 SFA-unsigned 的那一次）"
        required: true
      prerelease:
        description: "标记为预发布"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sign-and-publish:
    runs-on: ubuntu-latest
    environment: sign-gate
    permissions:
      actions: read            # 跳 run 取 apk.yml 的产物必需（缺它会被报成“Artifact not found”）
      contents: write
      attestations: write
      id-token: write
    env:
      EXPECTED_CERT_SHA256: b6f677491cc6e1ee0440afbc42568e9e114a6f963a2ee0a8780c7939e40e8012
      BT: /usr/local/lib/android/sdk/build-tools/37.0.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "build-tools;37.0.0"

      - name: 前置检查：签名所需 secret 必须齐（缺失就明确报错，不静默）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          missing=0
          for v in KEYSTORE_B64 KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
            if [ -z "${!v}" ]; then echo "缺少 $v"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "FATAL: 请在 Settings -> Environments -> sign-gate 下配置上述 secret（不要放在仓库级 Secrets，否则每条工作流都能读）"
            exit 1
          fi
          echo "secret 齐备（未打印任何值）"

      - name: 取未签名产物
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: SFA-unsigned
          run-id: ${{ inputs.run_id }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          path: in

      - name: 对齐、签名、并强制校验证书指纹
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -euo pipefail
          APK=$(find in -name 'SFA-*arm64-v8a.apk' | head -1)
          [ -n "$APK" ] || { echo "FATAL: 未找到 arm64 未签名 APK"; find in -type f; exit 1; }
          KS=$(mktemp /tmp/rs-XXXX.keystore)
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          "$BT/zipalign" -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS_NAME" \
            --ks-pass "pass:$KEYSTORE_PASS" --key-pass "pass:$ALIAS_PASS" \
            --out aligned-signed.apk aligned.apk
          CERT=$("$BT/apksigner" verify --print-certs aligned-signed.apk | awk '/certificate SHA-256 digest/{print $NF}')
          echo "签名证书 SHA-256=$CERT"
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "FATAL: 证书与手机已信任指纹不符，拒绝发布（要么 key 被换，要么 secret 配错）"
            exit 1
          fi
          mkdir -p out
          mv aligned-signed.apk "out/$(basename "${APK%.apk}")-signed.apk"
          ( cd out && sha256sum *-signed.apk > SHA256SUMS && cat SHA256SUMS )

      - name: SLSA 构建证明（把发布物与本次运行绑定）
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: out/*-signed.apk

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^VERSION_NAME=' version.properties | cut -d= -f2)
          TAG="v${VER}-ci${RUN_ID}"
          BODY="构建来源：apk 工作流 run ${RUN_ID}（https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}）\n\n"
          BODY="${BODY}签名证书 SHA-256：${EXPECTED_CERT_SHA256}\n\n校验值：\n\n\`\`\`\n$(cat out/SHA256SUMS)\n\`\`\`\n\n"
          BODY="${BODY}注意：本 release 的哈希同时应记录在 CI 无写权限的仓库（home-mesh 文档），两处不一致即为篡改信号。"
          ARGS=(--target "$GITHUB_SHA" --title "SFA ${VER} (CI ${RUN_ID})" --notes "$BODY")
          [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
          gh release create "$TAG" out/*-signed.apk out/SHA256SUMS "${ARGS[@]}" || {
            echo "FATAL: 发布失败"; exit 1;
          }
          echo "已发布 tag=$TAG"
